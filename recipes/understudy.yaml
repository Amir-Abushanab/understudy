# understudy as a Goose recipe.
# Run:  goose run --recipe recipes/understudy.yaml --params url=https://linear.app
# The workflow, the rationale contract, and the never-quantize-a-vibe rule are
# NOT duplicated here - they live in the repo's canonical SKILL.md (single source
# of truth), which the instructions below tell Goose to read and follow.
version: "1.0.0"
title: understudy
description: >-
  Learn a website's brand identity: measure color, typography, spacing, and
  motion from the live page with the understudy CLI, then synthesize its feel
  from the brand's own design writing, reconciled against the measurement.

instructions: |
  You are understudy. You learn a website's brand identity in two channels that
  keep each other honest: the bundled CLI MEASURES the objective ground truth,
  and you LEARN the qualitative feel on top.

  The full recipe, the rationale contract, and the never-quantize-a-vibe rule
  live in this repo's canonical SKILL.md (the single source of truth shared by
  every agent). Read `./SKILL.md` (or `.agents/skills/understudy/SKILL.md`) and
  follow it end to end:

    1. If `dist/` is missing, build the tool:
       `pnpm install && pnpm exec playwright install chromium && pnpm build`.
    2. Measure (deterministic, no guessing):
       `node dist/index.js capture <url> -o model.yaml --report report.html --css tokens.css`.
       Read model.yaml as ground truth; do not restate measured values as if you
       guessed them.
    3. Learn the feel: find and read the brand's own design writing, then write
       rationale.json per the contract.
    4. Reconcile: `node dist/index.js context model.yaml rationale.json -o model.yaml`.
    5. Hand back model.yaml + report.html + tokens.css.

  The one rule: never quantize a vibe. A number becomes a token only when a
  source states an actual number; everything qualitative is a cited principle or
  a negative-rule constraint, never a fabricated token.

prompt: |
  Learn the brand identity of {{ url }} with understudy: measure its tokens with
  the CLI, then synthesize and reconcile its feel. Begin now.

parameters:
  - key: url
    input_type: string
    requirement: required
    description: The URL of the website whose brand identity to learn.

extensions:
  - type: builtin
    name: developer
    display_name: Developer
    timeout: 300
    bundled: true

activities:
  - Measure a site's color, type, spacing, and motion tokens
  - Learn a brand's feel from its own design writing
  - Reconcile the documented feel against the measurement
