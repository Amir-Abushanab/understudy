<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>fixture: stagger-120ms</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 200vh; /* room so nothing else competes for the load motion */
      font: 16px/1.5 system-ui, sans-serif;
      background: #0b0b0f;
      color: #e8e8ef;
      display: grid;
      place-items: start center;
      padding-top: 12vh;
    }
    ul { list-style: none; margin: 0; padding: 0; width: min(420px, 80vw); }
    li {
      /* start hidden and shifted; the WAAPI animation reveals each item */
      opacity: 0;
      transform: translateY(12px);
      margin: 0 0 12px;
      padding: 18px 20px;
      border-radius: 12px;
      background: #16161f;
      border: 1px solid #26263a;
    }
    h1 { font-size: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #9a9ab5; }
  </style>
</head>
<body>
  <main>
    <h1>stagger-120ms</h1>
    <ul id="list">
      <li>Understudy watches the performance.</li>
      <li>It measures the timing, not the artifact.</li>
      <li>Each line arrives a beat after the last.</li>
      <li>The beat here is exactly 120 milliseconds.</li>
      <li>Recover it, and the analyzer is correct.</li>
    </ul>
  </main>

  <script>
    // Ground truth, also exposed for the browser integration test to cross-check.
    window.__GROUND_TRUTH__ = {
      fixture: 'stagger-120ms',
      staggerMs: 120,
      count: 5,
      itemDurationMs: 320,
      property: 'translateY',
      fromPx: 12,
      toPx: 0,
    };

    // One Element.animate() call per item, each scheduled 120ms after the last.
    // We deliberately use real setTimeout scheduling (not WAAPI `delay`) so the
    // recovered interval carries realistic frame jitter — the analyzer must
    // recover 120 through a variance gate, not read it off a declared field.
    const STAGGER_MS = 120;
    const DURATION_MS = 320;

    function reveal() {
      const items = Array.from(document.querySelectorAll('#list li'));
      items.forEach((el, i) => {
        setTimeout(() => {
          el.animate(
            [
              { opacity: 0, transform: 'translateY(12px)' },
              { opacity: 1, transform: 'translateY(0)' },
            ],
            { duration: DURATION_MS, easing: 'ease-out', fill: 'both' },
          );
        }, i * STAGGER_MS);
      });
    }

    if (document.readyState === 'complete') reveal();
    else window.addEventListener('load', reveal, { once: true });
  </script>
</body>
</html>
